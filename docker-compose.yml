name: integration-reliability-system

services:
  postgres:
    # postgres:17-alpine, pinned by digest only (DR-10b: the tag+digest form does not resolve locally under the containerd image store)
    image: postgres@sha256:9beea1b7f176d67e49e23092c63db9e98db32b303ce1b510749379ef46a3dcdd
    container_name: irs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: irs_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d irs_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    # redis:7.4.11-alpine, pinned by digest only (Task 012A record D2)
    image: redis@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    container_name: irs-redis
    restart: unless-stopped
    command: ["redis-server", "--aclfile", "/run/secrets/redis_acl", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    secrets:
      - redis_acl
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # Credential-free (D12): PONG, or the NOAUTH refusal of an unauthenticated PING, means alive
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | head -n 1 | grep -Eq '^(PONG|NOAUTH)'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    name: irs-dev-postgres-data
  redis_data:
    name: irs-dev-redis-data

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_acl:
    file: ./secrets/redis_users.acl